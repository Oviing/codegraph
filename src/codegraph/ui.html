<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codegraph Explorer</title>
<style>
:root{--bg:#fafafa;--panel:#fff;--fg:#1a1a1a;--mute:#6b7280;--line:#d1d5db;--edge:#9ca3af;--acc:#2563eb;--hot:#dc2626;--code:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--panel:#171a21;--fg:#e5e7eb;--mute:#9ca3af;--line:#2d333d;--edge:#6b7280;--acc:#60a5fa;--hot:#f87171;--code:#0b0d11}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row label{display:flex;align-items:center;gap:5px;color:var(--mute);white-space:nowrap}
b.brand{margin-right:4px}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
input[type=range]{padding:0;width:96px;accent-color:var(--acc)}
input[type=checkbox]{padding:0}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.on{border-color:var(--acc);color:var(--acc)}
#q{width:240px}#folder{width:110px}
#res{position:fixed;top:44px;left:96px;width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;display:none;z-index:8}
#res div{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}#res div:hover{background:var(--code)}
small,.mute{color:var(--mute)}
main{flex:1;min-height:0;display:flex}
#wrap{flex:1;position:relative;min-width:0}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
#legend{position:absolute;left:10px;top:10px;width:230px;max-height:52%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 0;opacity:.96}
#legend h5{margin:0;padding:2px 10px 4px;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;cursor:pointer}
#legend .it{padding:2px 10px;display:flex;gap:6px;align-items:center;cursor:pointer}
#legend .it:hover,#legend .it.sel{background:var(--code)}
#legend .sw{width:10px;height:10px;border-radius:50%;flex:none}
#legend .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#legend.min .it{display:none}
#lensbar{position:absolute;right:10px;bottom:36px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:none;width:230px}
#lensbar .g{height:8px;border-radius:4px;margin:4px 0 2px}
#lensbar div.l{display:flex;justify-content:space-between;color:var(--mute);font-size:11px}
#hud{position:absolute;left:10px;bottom:8px;color:var(--mute);background:var(--bg);padding:3px 8px;border-radius:6px;opacity:.92;pointer-events:none;max-width:70%}
#side{width:380px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;flex:none}
#side h3{margin:0 0 2px;word-break:break-all}
#side pre{background:var(--code);padding:10px;border-radius:6px;overflow:auto;max-height:340px;font:12px/1.45 ui-monospace,Menlo,monospace}
#side .btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
#side .nb{padding:3px 0;cursor:pointer;word-break:break-all}#side .nb:hover{color:var(--acc)}
#side h4{margin:14px 0 4px;color:var(--mute);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
#side .stat{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}#side .stat div{min-width:70px}#side .stat b{display:block;font-size:16px}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:5px;display:none;z-index:9;max-width:50ch;word-break:break-all}
@media (max-width:900px){main{flex-direction:column}#side{width:100%;height:42%;border-left:0;border-top:1px solid var(--line)}#legend{display:none}}
</style></head><body>
<header>
 <div class="row">
  <b class="brand">Codegraph</b>
  <input id="q" placeholder="Search a symbol  ( / )" autocomplete="off">
  <label>view <select id="view"><option value="c">communities → files → symbols</option><option value="f">files → symbols</option></select></label>
  <label>lens <select id="lens"></select></label>
  <label>layout <select id="layout"><option value="force">force</option><option value="grouped">grouped by community</option><option value="layered">layered (callers on top)</option><option value="radial">radial around selection</option></select></label>
  <button id="fit" title="Zoom to fit everything">Fit</button>
  <button id="unpin" title="Release all dragged nodes">Unpin all</button>
  <button id="reset" title="Back to the overview">Reset</button>
  <select id="export" title="Export what is on screen"><option value="">Export…</option><option value="png">PNG image</option><option value="svg">SVG vector</option><option value="json">JSON graph</option></select>
 </div>
 <div class="row">
  <label title="Louvain resolution: lower merges communities, higher splits them">clusters <input id="rs" type="range" min="0.2" max="3" step="0.1" value="1"><span id="rsv">1.0</span></label>
  <label title="Hide links lighter than this">min links <input id="minw" type="range" min="1" max="10" step="1" value="1"><span id="minwv">1</span></label>
  <label>links <select id="conf"><option value="all">all</option><option value="ext">certain only</option></select></label>
  <label title="Only show nodes this many hops from the selection (0 = off)">hops <input id="hops" type="range" min="0" max="4" step="1" value="0"><span id="hopsv">off</span></label>
  <label><input id="tests" type="checkbox" checked> tests</label>
  <label>kind <select id="kind"><option value="">any</option><option>function</option><option>method</option><option>class</option><option>constant</option></select></label>
  <label>folder <input id="folder" placeholder="src/…"></label>
  <label>colour <select id="color"><option value="c">community</option><option value="d">folder</option></select></label>
  <button id="lbl" class="on">Labels</button>
  <button id="surp" title="Links between different communities and folders that you would not guess from the file layout">Surprises</button>
  <button id="snap" title="Remember the current communities">Save snapshot</button>
  <button id="diff" title="Which symbols changed community since the snapshot">Compare snapshot</button>
 </div>
</header>
<div id="res"></div>
<main>
 <div id="wrap"><canvas id="c"></canvas><div id="legend"></div><div id="lensbar"></div><div id="hud"></div></div>
 <aside id="side"></aside>
</main>
<div id="tip"></div>
<script>
"use strict";
const $=id=>document.getElementById(id), cv=$('c'), cx=cv.getContext('2d'), side=$('side'), tip=$('tip'), hud=$('hud'), wrap=$('wrap');
const el=(t,props={},...kids)=>{const e=document.createElement(t);Object.assign(e,props);kids.forEach(k=>e.append(k));return e};
const S={res:1,view:'c',lens:'',layout:'force',color:'c',minW:1,conf:'all',tests:true,kind:'',folder:'',hops:0,iso:null,hl:null,labels:true};
const LENS_OPTS=[['','none (community colours)'],['importance','importance'],['bottlenecks','bottlenecks'],['cycles','cycles'],['layers','layers'],
  ['coupling','coupling / misplaced'],['kcore','core vs periphery'],['deadcode','dead code'],['hotspots','hotspots (git)']];
LENS_OPTS.forEach(([v,t])=>$('lens').append(el('option',{value:v,textContent:t})));
const api=async(p,q={})=>{const r=await fetch('/api/'+p+'?'+new URLSearchParams({res:S.res,...q}));return r.json()};
const fmt=v=>v>=100?Math.round(v)+'':v>=1?v.toFixed(1):v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
const base=p=>p.split('/').pop();
const isTest=f=>/(^|\/)(tests?|__tests__)\/|(^|\/)test_|_test\.|\.(test|spec)\./.test(f);
const dark=matchMedia('(prefers-color-scheme:dark)');
let css={};const readCss=()=>{const s=getComputedStyle(document.documentElement);['bg','fg','mute','edge','acc','hot','line','panel'].forEach(k=>css[k]=s.getPropertyValue('--'+k).trim())};
dark.addEventListener('change',()=>{readCss();legend();dirty=true});readCss();
const MARK={impact:'#dc2626',surprise:'#f59e0b',path:'#10b981',moved:'#a855f7'};

// ---- state ------------------------------------------------------------------------------------
let P=[],PL=[],PK=new Map(),COMMS=new Map(),TOTAL=0;                // server data: pieces (file x community), links, communities
let nodes=new Map(),links=[],VN=[],VL=[],symEdges=new Map(),symInfo=new Map();
let marks=new Map(),sel=null,hov=null,alpha=1,auto=true,dirty=true,ticks=0,pathFrom=null,diffRes=null;
let lensData=null,lensVal={s:new Map(),p:new Map(),f:new Map(),c:new Map()},hiBy={c:1,p:1,f:1,s:1},layerOf=new Map(),layerMax=1,radial=new Map();
const cam={x:0,y:0,k:1};let W=0,H=0;const dpr=devicePixelRatio||1;
function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;dirty=true}
new ResizeObserver(resize).observe(wrap);resize();

// ---- colours ----------------------------------------------------------------------------------
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)};
const hue=c=>c<0?'#8b93a1':`hsl(${(c*137.508+20)%360},${dark.matches?58:64}%,${dark.matches?62:46}%)`;
const dirOf=f=>f.split('/').slice(0,-1).slice(0,2).join('/')||'.';
const ramp=t=>`hsl(${52-52*Math.min(1,Math.max(0,t))},92%,${dark.matches?58:50}%)`;
const rampLayer=t=>`hsl(${215-190*Math.min(1,Math.max(0,t))},68%,${dark.matches?62:50}%)`;
function baseColor(n){return S.color==='d'&&n.file?hue(hash(dirOf(n.file))%200):hue(n.c)}
function nodeVal(n){
  if(S.lens==='layers')return layerOf.has(n.key)?layerOf.get(n.key):0;
  if(!lensData)return 0;
  if(n.t==='s')return lensVal.s.get(n.id)||0;
  if(n.t==='p')return lensVal.p.get(n.pk)||0;
  if(n.t==='f')return lensVal.f.get(n.file)||0;
  return lensVal.c.get(n.cid)||0}
function colorOf(n){
  if(!S.lens||!(lensData||S.lens==='layers'))return baseColor(n);
  const v=nodeVal(n);
  if(S.lens==='layers')return rampLayer(layerMax?v/layerMax:0);
  if(v<=0)return dark.matches?'#3b4250':'#d4d8df';
  return ramp(v/(hiBy[n.t]||1))}

// ---- building the graph -----------------------------------------------------------------------
const rnd=()=>Math.random()-.5;
const commLabel=c=>c<0?'unconnected symbols':(COMMS.get(c)?.label||'community '+c);
function addNode(n,x,y){n.x=x+rnd()*30;n.y=y+rnd()*30;n.vx=n.vy=0;n.pin=false;nodes.set(n.key,n);return n}
const mkComm=(c,agg,x,y)=>addNode({key:'c:'+c,t:'c',cid:c,c,label:commLabel(c),n:agg.n,files:agg.files.size,rank:agg.rank,r:10+Math.sqrt(agg.n)*2.3},x,y);
const mkPiece=(p,x,y)=>addNode({key:'p:'+p.k,t:'p',pk:p.k,file:p.f,c:p.c,n:p.n,loc:p.loc,rank:p.rank,label:base(p.f),r:6+Math.sqrt(p.n)*1.9},x,y);
const mkFile=(f,agg,x,y)=>addNode({key:'f:'+f,t:'f',file:f,c:agg.c,n:agg.n,loc:agg.loc,rank:agg.rank,label:base(f),r:7+Math.sqrt(agg.n)*1.7},x,y);
function symNode(s,ax,ay){
  symInfo.set(s.id,s);const k='s:'+s.id;if(nodes.has(k))return nodes.get(k);
  return addNode({key:k,t:'s',id:s.id,file:s.file,c:s.c,kind:s.kind,rank:s.rank,label:s.name,r:3.5+Math.min(14,Math.sqrt(s.rank*2500))},ax,ay)}
function buildTop(){
  nodes=new Map();symEdges=new Map();symInfo=new Map();marks=new Map();sel=null;auto=true;ticks=0;
  const groups=new Map();
  for(const p of P){
    const key=S.view==='c'?p.c:p.f;
    const g=groups.get(key)||{n:0,rank:0,loc:0,files:new Set(),c:p.c,best:0};
    g.n+=p.n;g.rank+=p.rank;g.files.add(p.f);if(S.view==='f'){g.loc=p.loc;if(p.n>g.best){g.best=p.n;g.c=p.c}}groups.set(key,g)}
  let i=0;const R=Math.max(120,Math.sqrt(groups.size)*60);
  for(const [key,g] of groups){const a=i++*2.4;const x=Math.cos(a)*R*Math.sqrt(i/groups.size),y=Math.sin(a)*R*Math.sqrt(i/groups.size);
    S.view==='c'?mkComm(key,g,x,y):mkFile(key,g,x,y)}
  rebuild();alpha=1}
const cover=p=>nodes.get('p:'+p.k)||nodes.get('f:'+p.f)||nodes.get('c:'+p.c)||null;
function entity(id){const n=nodes.get('s:'+id);if(n)return n;const s=symInfo.get(id);if(!s)return null;
  const p=PK.get(s.file+'|'+s.c);return p?cover(p):null}
function rebuild(){
  const m=new Map();
  const add=(a,b,w,e,k,q)=>{if(!a||!b||a===b)return;const key=a.key+'>'+b.key,o=m.get(key);
    if(o){o.w+=w;o.e+=e;if(q==='extracted')o.q=q}else m.set(key,{a,b,w,e,k,q:k==='import'?'import':q})};
  for(const l of PL){const a=PK.get(l.s),b=PK.get(l.t);if(a&&b)add(cover(a),cover(b),l.w,l.e,l.k,l.e>0?'extracted':'inferred')}
  for(const e of symEdges.values())add(entity(e.s),entity(e.t),1,e.q==='extracted'?1:0,e.k,e.q);
  links=[...m.values()].filter(l=>(S.conf==='ext'?l.e:l.w)>=S.minW&&(S.conf!=='ext'||l.e>0));
  refilter();status()}
function status(){
  const c={c:0,p:0,f:0,s:0};for(const n of nodes.values())c[n.t]++;
  hud.textContent=[c.c&&`${c.c} communities`,c.p&&`${c.p} file groups`,c.f&&`${c.f} files`,c.s&&`${c.s} symbols`].filter(Boolean).join(', ')+
    ` shown · ${TOTAL} files indexed · drag to pin, double-click to open, wheel to zoom`}

// ---- filtering, lens values, layer/radial computation ----------------------------------------
function hidden(n){
  if(S.iso!==null&&n.c!==S.iso)return true;
  if(n.t==='c')return false;
  if(!S.tests&&isTest(n.file))return true;
  if(S.folder&&!n.file.includes(S.folder))return true;
  if(n.t==='s'&&S.kind&&n.kind!==S.kind)return true;
  return false}
function bfs(start,L,maxd=1e9){  // undirected distances over visible links
  const adj=new Map();for(const l of L){(adj.get(l.a.key)||adj.set(l.a.key,[]).get(l.a.key)).push(l.b.key);(adj.get(l.b.key)||adj.set(l.b.key,[]).get(l.b.key)).push(l.a.key)}
  const d=new Map([[start,0]]),q=[start];
  for(let i=0;i<q.length;i++){const v=q[i];if(d.get(v)>=maxd)continue;for(const w of adj.get(v)||[])if(!d.has(w)){d.set(w,d.get(v)+1);q.push(w)}}
  return d}
function refilter(){
  for(const n of nodes.values())n.h=hidden(n);
  VN=[...nodes.values()].filter(n=>!n.h);let L=links.filter(l=>!l.a.h&&!l.b.h);
  if(S.hops>0&&sel&&nodes.has(sel)){const d=bfs(sel,L,S.hops);VN=VN.filter(n=>d.has(n.key));L=L.filter(l=>d.has(l.a.key)&&d.has(l.b.key))}
  VL=L;hiBy={c:0,p:0,f:0,s:0};
  for(const n of VN)n.deg=0;for(const l of VL){l.a.deg++;l.b.deg++}
  [...VN].sort((a,b)=>b.r-a.r).forEach((n,i)=>n.top=i<18);
  if(S.lens&&S.lens!=='layers')for(const n of VN)hiBy[n.t]=Math.max(hiBy[n.t],nodeVal(n));
  if(S.layout==='layered'||S.lens==='layers')computeLayers();
  if(S.layout==='radial')computeRadial();
  reheat(.3)}
function computeLayers(){
  // callers on top: condense cycles (Tarjan), then longest path from the sources. For aggregated links only the
  // dominant direction counts, otherwise every pair of communities that call each other would form one cycle.
  const w=new Map();for(const l of VL){w.set(l.a.key+'>'+l.b.key,(w.get(l.a.key+'>'+l.b.key)||0)+l.w)}
  const out=new Map(VN.map(n=>[n.key,[]]));
  for(const [k,v] of w){const [a,b]=k.split('>');const back=w.get(b+'>'+a)||0;if(v>back||(back===0))out.get(a)?.push(b)}
  let idx=0;const index=new Map(),low=new Map(),on=new Set(),stack=[],comp=new Map();let nc=0;
  for(const root of out.keys()){if(index.has(root))continue;
    index.set(root,idx);low.set(root,idx++);stack.push(root);on.add(root);const work=[[root,0]];
    while(work.length){const top=work[work.length-1],v=top[0],ns=out.get(v);
      if(top[1]<ns.length){const x=ns[top[1]++];
        if(!index.has(x)){index.set(x,idx);low.set(x,idx++);stack.push(x);on.add(x);work.push([x,0])}
        else if(on.has(x))low.set(v,Math.min(low.get(v),index.get(x)))}
      else{work.pop();if(work.length){const u=work[work.length-1][0];low.set(u,Math.min(low.get(u),low.get(v)))}
        if(low.get(v)===index.get(v)){let x;do{x=stack.pop();on.delete(x);comp.set(x,nc)}while(x!==v);nc++}}}}
  const cout=Array.from({length:nc},()=>new Set()),indeg=new Array(nc).fill(0);
  for(const [a,ns] of out)for(const b of ns){const ca=comp.get(a),cb=comp.get(b);if(ca!==cb&&!cout[ca].has(cb)){cout[ca].add(cb);indeg[cb]++}}
  const depth=new Array(nc).fill(0),q=[];indeg.forEach((d,i)=>{if(!d)q.push(i)});
  for(let i=0;i<q.length;i++){const c=q[i];for(const d of cout[c]){depth[d]=Math.max(depth[d],depth[c]+1);if(--indeg[d]===0)q.push(d)}}
  layerOf=new Map();layerMax=1;for(const n of VN){const d=depth[comp.get(n.key)]||0;layerOf.set(n.key,d);layerMax=Math.max(layerMax,d)}}
function computeRadial(){
  radial=new Map();if(!sel||!nodes.has(sel))return;
  const d=bfs(sel,VL),rings=new Map();let far=0;
  for(const n of VN){const k=d.has(n.key)?d.get(n.key):-1;if(k>far)far=k;(rings.get(k)||rings.set(k,[]).get(k)).push(n)}
  if(rings.has(-1)){rings.set(far+1,rings.get(-1));rings.delete(-1)}
  for(const [k,ns] of rings){ns.sort((a,b)=>a.c-b.c||b.rank-a.rank);const R=k===0?0:70+k*105;
    ns.forEach((n,i)=>{const a=2*Math.PI*(i+.5)/ns.length+k*.4;radial.set(n.key,[Math.cos(a)*R,Math.sin(a)*R])})}}
function reheat(a=.5){alpha=Math.max(alpha,a);dirty=true}

// ---- expansion / collapse ---------------------------------------------------------------------
async function expand(n){
  if(n.t==='c'){const ps=P.filter(p=>p.c===n.cid);nodes.delete(n.key);ps.forEach(p=>mkPiece(p,n.x,n.y));rebuild();reheat(.8);return}
  if(n.t==='s')return expandSymbol(n.id);
  const d=await api('file',n.t==='p'?{path:n.file,c:n.c}:{path:n.file});
  d.symbols.forEach(s=>symNode(s,n.x,n.y));d.far.forEach(s=>symInfo.set(s.id,s));
  d.edges.forEach(e=>symEdges.set(e.s+'>'+e.t+e.k,e));nodes.delete(n.key);rebuild();reheat(.8)}
async function expandSymbol(id){
  const d=await api('symbol',{id});if(d.error)return;
  const e=entity(id),me=symNode(d,e?e.x:0,e?e.y:0);
  d.far.sort((a,b)=>b.rank-a.rank).slice(0,40).forEach(s=>symNode(s,me.x,me.y));
  d.edges.forEach(x=>symEdges.set(x.s+'>'+x.t+x.k,x));rebuild();reheat(.7);return d}
function collapse(n){
  const rm=[];let x=0,y=0,c=0;
  const take=m=>{rm.push(m.key);x+=m.x;y+=m.y;c++};
  if(n.t==='s'){for(const m of nodes.values())if(m.t==='s'&&m.file===n.file&&(S.view==='f'||m.c===n.c))take(m)}
  else if(n.t==='p'){for(const m of nodes.values())if((m.t==='p'||m.t==='s')&&m.c===n.c)take(m)}
  if(!c)return;rm.forEach(k=>nodes.delete(k));
  const at=z=>{z.x=x/c;z.y=y/c;return z};
  if(n.t==='s'){
    if(S.view==='c'){const p=PK.get(n.file+'|'+n.c);if(p)at(mkPiece(p,0,0))}
    else{const ps=P.filter(p=>p.f===n.file);at(mkFile(n.file,{n:ps.reduce((a,p)=>a+p.n,0),rank:ps.reduce((a,p)=>a+p.rank,0),loc:ps[0]?.loc||0,c:ps[0]?.c??-1},0,0))}}
  else{const ps=P.filter(p=>p.c===n.c);at(mkComm(n.c,{n:ps.reduce((a,p)=>a+p.n,0),rank:ps.reduce((a,p)=>a+p.rank,0),files:new Set(ps.map(p=>p.f))},0,0))}
  sel=null;rebuild();reheat(.5);panel()}
const collapsible=n=>((n.t==='s'||n.t==='p')&&S.view==='c')||(n.t==='s'&&S.view==='f');

// ---- force layout -----------------------------------------------------------------------------
const CELL=300;
function step(){
  const arr=VN,n=arr.length;arr.forEach((a,i)=>a.i=i);
  const grid=new Map(),cen=new Map(),fil=new Map();

      side.append(stat(['symbols',d.n],['files',d.files],['cohesion',Math.round(d.cohesion*100)+'%'],['links in / out',d.internal+' / '+d.external]),
        el('p',{className:'mute',textContent:`Mostly in ${d.area}. Cohesion is the share of this community's link weight that stays inside it: low values mean it is tangled with its neighbours.`}),
        el('h4',{textContent:'Key symbols'}));
      d.symbols.forEach(s=>side.append(nb(`${s.qn}   ${s.file}`,()=>focusSymbol(s.id,s))));
      side.append(el('h4',{textContent:'Files'}));d.file_list.forEach(f=>side.append(nb(`${f.path}  ×${f.n}`,()=>focusFile(f.path))));
      if(d.neighbours.length){side.append(el('h4',{textContent:'Most linked communities'}));
        d.neighbours.forEach(o=>side.append(nb(`${o.label}  ×${o.w}`,()=>{const m=nodes.get('c:'+o.id);if(m){center(m);select(m.key)}})))}}
    return}
  if(n.t==='f'||n.t==='p'){
    side.append(el('h3',{textContent:n.file}),el('div',{className:'mute',textContent:`${n.n} symbols${n.loc?' · '+n.loc+' lines':''}${n.t==='p'?' · in “'+(cm?cm.label:commLabel(n.c))+'”':''}`}));
    lensLine();
    side.append(el('div',{className:'btns'},btn('Open into symbols',()=>{expand(n);select(null)}),
      ...(collapsible(n)?[btn('Collapse to community',()=>collapse(n))]:[]),pinBtn));
    nearList();return}
  const d=await api('symbol',{id:n.id});if(sel!==n.key)return;
  side.append(el('h3',{textContent:d.qn}),el('div',{className:'mute',textContent:`${d.kind} · ${d.file}:${d.l1}-${d.l2}`}),
    el('div',{className:'mute',textContent:'community: '+(d.clabel||'none')}));lensLine();
  if(d.sig)side.append(el('div',{style:'margin-top:6px;font-family:ui-monospace,Menlo,monospace;word-break:break-all',textContent:d.sig}));
  if(d.doc)side.append(el('p',{className:'mute',textContent:d.doc.slice(0,400)}));
  const impactOn=[...marks.values()].includes('impact');
  side.append(el('div',{className:'btns'},
    btn('Expand neighbours',async()=>{await expandSymbol(n.id);panel()},'pull in callers and callees'),
    btn(impactOn?'Hide impact':'Show impact',async()=>{if(impactOn){clearMarks('impact');panel()}else{const r=await api('impact',{id:n.id});addOverlay({symbols:[d,...r.symbols],edges:r.edges},'impact');panel()}},'transitive callers: what breaks if this changes'),
    ...(collapsible(n)?[btn('Collapse',()=>collapse(n),'fold this back into its file group')]:[]),
    btn('Path: start here',()=>{pathFrom={id:n.id,qn:d.qn};panel()},'then select another symbol'),
    ...(pathFrom&&pathFrom.id!==n.id?[btn(`Path from ${pathFrom.qn.split('.').pop()} to here`,()=>doPath(pathFrom.id,n.id))]:[]),pinBtn));
  const info=id=>symInfo.get(id)||d.far.find(s=>s.id===id);
  const rows=(a,f)=>d.edges.filter(f).map(e=>[info(a(e)),e]);
  const list=(title,rs)=>{if(!rs.length)return;side.append(el('h4',{textContent:`${title} (${rs.length})`}));
    rs.slice(0,40).forEach(([s,e])=>s&&side.append(nb(`${s.qn}${e.q&&e.q!=='extracted'?'  ?':''}   ${s.file}`,()=>focusSymbol(s.id,s))))};
  list('Called by',rows(e=>e.s,e=>e.t===n.id));list('Calls / uses',rows(e=>e.t,e=>e.s===n.id));
  side.append(el('h4',{textContent:'Source'}),el('pre',{textContent:d.source||'(no source)'}))}

// ---- search -----------------------------------------------------------------------------------
let tm;const res=$('res');
$('q').addEventListener('input',e=>{clearTimeout(tm);const v=e.target.value.trim();
  if(!v){res.style.display='none';return}
  tm=setTimeout(async()=>{const d=await api('search',{q:v});res.replaceChildren();
    d.symbols.forEach(s=>res.append(el('div',{onclick:()=>{res.style.display='none';focusSymbol(s.id,s)}},el('span',{textContent:s.qn}),el('small',{textContent:`  ${s.kind} · ${s.file}`}))));
    if(!d.symbols.length)res.append(el('div',{className:'mute',textContent:'no matches'}));
    const r=$('q').getBoundingClientRect();res.style.left=r.left+'px';res.style.top=r.bottom+4+'px';res.style.display='block'},180)});

// ---- export -----------------------------------------------------------------------------------
function download(name,blob){const a=el('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportAs(kind){
  if(kind==='png'){const t=el('canvas');t.width=cv.width;t.height=cv.height;const c=t.getContext('2d');c.fillStyle=css.bg;c.fillRect(0,0,t.width,t.height);c.drawImage(cv,0,0);
    t.toBlob(b=>download('codegraph.png',b))}
  if(kind==='json'){
    const o={view:S.view,lens:S.lens,resolution:S.res,
      nodes:VN.map(n=>({id:n.key,type:n.t,label:n.t==='c'?n.label:n.t==='s'?symInfo.get(n.id).qn:n.file,file:n.file||null,community:n.c,symbols:n.n||1,value:S.lens?nodeVal(n):null,x:Math.round(n.x),y:Math.round(n.y)})),
      links:VL.map(l=>({source:l.a.key,target:l.b.key,weight:l.w,certain:l.e,kind:l.k}))};
    download('codegraph.json',new Blob([JSON.stringify(o,null,1)],{type:'application/json'}))}
  if(kind==='svg'){
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const out=[`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="system-ui,sans-serif" font-size="12">`,`<rect width="100%" height="100%" fill="${css.bg}"/>`];
    for(const h of hulls()){const [x,y]=toS(h.x,h.y);out.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(h.r*cam.k).toFixed(1)}" fill="${hue(h.c)}" fill-opacity=".08"/>`)}
    for(const l of VL){const [ax,ay]=toS(l.a.x,l.a.y),[bx,by]=toS(l.b.x,l.b.y);
      out.push(`<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="${css.edge}" stroke-opacity=".5" stroke-width="${Math.min(5,1+Math.log2(l.w)).toFixed(1)}"${l.q==='extracted'?'':' stroke-dasharray="5 4"'}/>`)}
    for(const n of VN){const [x,y]=toS(n.x,n.y),r=Math.max(n.r*cam.k,2);
      out.push(n.t==='p'||n.t==='f'?`<rect x="${(x-r*.8).toFixed(1)}" y="${(y-r*.8).toFixed(1)}" width="${(r*1.6).toFixed(1)}" height="${(r*1.6).toFixed(1)}" rx="${(r*.35).toFixed(1)}" fill="${colorOf(n)}"/>`:
        `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${colorOf(n)}"/>`);
      if(labelFor(n,null,cam.k))out.push(`<text x="${(x+r+4).toFixed(1)}" y="${(y+4).toFixed(1)}" fill="${css.fg}">${esc(n.t==='c'?`${n.label} (${n.n})`:n.label)}</text>`)}
    out.push('</svg>');download('codegraph.svg',new Blob([out.join('\n')],{type:'image/svg+xml'}))}}

async function load(){
  hud.textContent='clustering and loading...';
  const d=await api('overview');
  P=d.pieces;PL=d.links;TOTAL=d.total;COMMS=new Map(d.comms.map(c=>[c.id,c]));PK=new Map(P.map(p=>[p.k,p]));
  if(!P.length){hud.textContent='nothing indexed yet';return}
  buildTop();await loadLens();refilter();legend();panel()}
load();
